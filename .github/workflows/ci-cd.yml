name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/nginx-config

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Nginx
        run: sudo apt update && sudo apt install nginx -y

      - name: Deploy
        run: |
          sudo cp index.html /var/www/html/index.html
          sudo systemctl restart nginx
